                  type: "string"
                  x-echo: true
                  description: "Resend the value the page rendered; it belongs to the device, not to the form."
                  readOnly: true
                gateway:
                  type: "string"
                  x-echo: true
                  description: "Resend the value the page rendered; it belongs to the device, not to the form."
                  readOnly: true
                mgmt_vlan:
                  type: "string"
                  default: "1"
                err_flag:
                  type: "string"
                  default: "0"
                err_msg:
                  type: "string"
                prot_msg:
                  type: "string"
                  default: "Warning: Changing protocol mode will reset IP configuration."
                submt:
                  type: "string"
                  default: "16"
                  description: "Apply flag. The web UI posts `16` (0x10) when Apply is pressed; an empty value is accepted but changes nothing."
                cncel:
                  type: "string"
              required:
                - "net_proto_next"
                - "mgmt_vlan"
                - "err_flag"
                - "err_msg"
                - "prot_msg"
