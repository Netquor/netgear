openapi: "3.1.0"
info:
  title: "NETGEAR GS108Tv2 web UI"
  version: "1.0.0"
  description: "Unofficial description of the NETGEAR GS108Tv2 ProSAFE web UI as an HTTP contract. The switch has no JSON API: GET returns page HTML, and POST submits a form. Most forms post back to the page that rendered them; the rest post to their own `*_rw.html` handler, which appears here as a separate path. POSTs are read-modify-write, so fetch the page, change the fields you care about, and submit everything else as rendered. Fields marked `x-echo` carry the device's current address or identity and must be resent unchanged. Field schemas were captured from a live device on 2026-11-26T23:55:27-0600. Of 163 menu pages, 139 answered with real content, 135 expose forms (1872 fields), and 24 were not usable on that model. Paths marked `x-unsupported` are in the menu but are not served by every model. Operations marked destructive reboot the switch, restore factory defaults, or write firmware; call them deliberately. Not affiliated with NETGEAR."
servers:
  - url: "http://192.0.2.10"
security:
  - cookieAuth: []
tags:
  - name: "Login"
  - name: "System"
  - name: "Switching"
  - name: "Routing"
  - name: "QoS"
  - name: "Security"
  - name: "Monitoring"
  - name: "Maintenance"
  - name: "Help"
paths:
  "/base/system/management/sysInfo_rw.html":
    post:
      tags:
        - "System"
      summary: "System Information (apply)"
      description: "Apply the form shown on `base/system/management/sysInfo.html`. This firmware posts edits to a separate `*_rw` handler, so the write target is `base/system/management/sysInfo_rw.html` rather than the page."
      x-risk: "read"
      x-section: "Management"
      responses:
        "200":
          description: "Resulting page HTML."
          content:
            "text/html":
              schema:
                "$ref": "#/components/schemas/HtmlPage"
        "302":
          description: "Redirect back to the page or to the login screen."
      operationId: "post-base-system-management-sysinfo-rw"
      requestBody:
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              properties:
                sysName:
                  type: "string"
                sysLocation:
                  type: "string"
                sysContact:
                  type: "string"
                err_flag:
                  type: "string"
                  default: "0"
                err_msg:
                  type: "string"
                submt:
                  type: "string"
                  default: "16"
                  description: "Apply flag. The web UI posts `16` (0x10) when Apply is pressed; an empty value is accepted but changes nothing."
                refrsh:
                  type: "string"
                cncel:
                  type: "string"
              required:
                - "sysName"
                - "sysLocation"
                - "sysContact"
                - "err_flag"
                - "err_msg"
                - "submt"
                - "refrsh"
                - "cncel"
  "/base/system/management/sysInfo.html":
