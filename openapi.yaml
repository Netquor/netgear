      description: "Submit a form back to `base/system/traceroute.html` and receive the re-rendered page. Send every field the browser would send; omitted fields revert to defaults."
      x-risk: "action"
      x-section: "Troubleshooting"
      responses:
        "200":
          description: "Resulting page HTML."
          content:
            "text/html":
              schema:
                "$ref": "#/components/schemas/HtmlPage"
        "302":
          description: "Redirect back to the page or to the login screen."
      operationId: "post-base-system-traceroute"
      requestBody:
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              properties:
                dest_host:
                  type: "string"
                probe_count:
                  type: "string"
                  default: "3"
                max_ttl:
                  type: "string"
                  default: "30"
                init_ttl:
                  type: "string"
                  default: "1"
                max_fail:
                  type: "string"
                  default: "5"
                probe_interval:
                  type: "string"
                  default: "3"
                port:
                  type: "string"
                  default: "33434"
                probe_size:
                  type: "string"
                  default: "0"
                traceroute_result:
                  type: "string"
                err_flag:
                  type: "string"
                  default: "0"
                err_msg:
                  type: "string"
                submt:
                  type: "string"
                  default: "16"
                  description: "Apply flag. The web UI posts `16` (0x10) when Apply is pressed; an empty value is accepted but changes nothing."
                cncel:
                  type: "string"
                submit_flag:
                  type: "string"
              required:
                - "dest_host"
                - "probe_count"
                - "max_ttl"
                - "init_ttl"
                - "max_fail"
                - "probe_interval"
                - "port"
                - "probe_size"
                - "traceroute_result"
                - "err_flag"
                - "err_msg"
                - "submt"
                - "cncel"
                - "submit_flag"
