  "/base/main_login.html":
    post:
      tags:
        - "Login"
      summary: "Log in"
      description: "Sets the session cookie. This firmware answers 200 with Set-Cookie: SID on success and re-renders the login page with err_flag=1 on failure, so check the cookie rather than the status code. Send Referer: <base>/."
      security: []
      operationId: "post-login"
      requestBody:
        content:
          "application/x-www-form-urlencoded":
            schema:
              type: "object"
              properties:
                pwd:
                  type: "string"
                  description: "Admin password."
                err_flag:
                  type: "string"
                  default: "0"
                err_msg:
                  type: "string"
                  default: ""
                login.x:
                  type: "string"
                  default: "10"
                login.y:
                  type: "string"
                  default: "10"
              required:
                - "pwd"
      responses:
        "200":
          description: "Login accepted when Set-Cookie carries SID; otherwise the login HTML with err_msg is returned."
          headers:
            Set-Cookie:
              schema:
                type: "string"
    get:
      tags:
        - "Login"
      summary: "Login page"
      security: []
      operationId: "get-login-page"
      responses:
        "200":
          description: "Login HTML."
          content:
            "text/html":
              schema:
                "$ref": "#/components/schemas/HtmlPage"
components:
  securitySchemes:
    cookieAuth:
      type: "apiKey"
      in: "header"
      name: "Cookie"
      description: "Session cookie issued by POST /base/main_login.html. On this firmware it is `SID`, scoped to `/` and HttpOnly."
  schemas:
    HtmlPage:
      type: "string"
      description: "Server-rendered HTML page."
